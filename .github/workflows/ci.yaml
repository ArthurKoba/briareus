name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    env:
      MANAGEMENT_ENCRYPTION_KEY: ZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmY=
      MANAGEMENT_SERVICE_TOKEN: ci-management-token
      MANAGEMENT_ADMIN_USERNAME: ci-admin
      MANAGEMENT_ADMIN_PASSWORD: ci-admin-password
      MANAGEMENT_SESSION_SECRET: ci-session-secret
      MCP_PUBLIC_BASE_URL: https://mcp.example.test
      MCP_ALLOWED_HOSTS: mcp.example.test
      MCP_ALLOWED_ORIGINS: https://mcp.example.test
      GITHUB_OAUTH_CLIENT_ID: ci-client
      GITHUB_OAUTH_CLIENT_SECRET: ci-secret
      GITHUB_OAUTH_JWT_SIGNING_KEY: ci-jwt-signing-key
      GITHUB_OAUTH_ALLOWED_USERS: ci-user
    strategy:
      fail-fast: false
      matrix:
        target:
          - auth
          - gateway
          - management
          - github
          - gitlab
          - files
          - curl
          - terminal
          - analysis
          - ghidra
          - signoz
          - coolify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config >/dev/null
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: mcp-bridge:${{ matrix.target }}-ci
