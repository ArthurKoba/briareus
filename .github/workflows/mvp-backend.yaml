name: MVP Backend

on:
  pull_request:
    paths:
      - "services/**"
      - "tests/**"
      - "scripts/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/mvp-backend.yaml"
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Explicitly run PostgreSQL/Valkey integration tests'
        type: boolean
        required: false
        default: false
      smoke_runner:
        description: 'Run one quick Zoomies DinD runner smoke check'
        type: boolean
        required: false
        default: false
      smoke_auth_packaging:
        description: 'Explicitly verify Auth Compose expansion and one image build on Zoomies'
        type: boolean
        required: false
        default: false
      build_images:
        description: 'Explicitly build the three Docker images'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --frozen --dev --no-install-project
      - run: .venv/bin/ruff check services tests scripts/provision_authorization_database.py
      - run: .venv/bin/mypy services/authorization services/bridge services/common services/admin-api/src scripts/provision_authorization_database.py
      - run: PYTHONPATH=services:services/admin-api/src .venv/bin/python -m unittest discover -s tests -v

  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration == true
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      valkey:
        image: valkey/valkey:9.1.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --frozen --dev --no-install-project
      - name: Provision authorization database
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          AUTHORIZATION_POSTGRES_DB: authorization_mvp
          AUTHORIZATION_POSTGRES_USER: authorization_mvp
          AUTHORIZATION_POSTGRES_PASSWORD: authorization_mvp_secret
        run: .venv/bin/python scripts/provision_authorization_database.py
      - name: Run PostgreSQL and Valkey integration tests
        env:
          TEST_POSTGRES_HOST: 127.0.0.1
          TEST_POSTGRES_PORT: "5432"
          TEST_AUTHORIZATION_POSTGRES_DB: authorization_mvp
          TEST_AUTHORIZATION_POSTGRES_USER: authorization_mvp
          TEST_AUTHORIZATION_POSTGRES_PASSWORD: authorization_mvp_secret
          TEST_VALKEY_URL: redis://127.0.0.1:6379/15
        run: PYTHONPATH=services .venv/bin/python -m unittest tests.test_postgres_authorization_access -v

  smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_runner == true
    runs-on: zoomies-mcp-bridge-builder
    timeout-minutes: 10
    steps:
      - name: Verify DinD with a minimal Docker build
        shell: bash
        run: |
          docker version
          docker info --format 'Server={{.ServerVersion}} Driver={{.Driver}}'
          printf 'FROM busybox:1.36\nRUN echo zoomies-dind-ok\n' | docker build --progress=plain -t zoomies-dind-smoke -

  auth-packaging:
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_auth_packaging == true
    runs-on: zoomies-mcp-bridge-builder
    timeout-minutes: 15
    env:
      AUTHORIZATION_PUBLIC_BASE_URL: https://authorization.example.test
      MCP_PUBLIC_BASE_URL: https://mcp.example.test
      AUTHORIZATION_POSTGRES_USER: ci_authorization_user
      AUTHORIZATION_POSTGRES_PASSWORD: ci-only-dummy-password
      AUTHORIZATION_BOOTSTRAP_USERNAME: ci-admin
      AUTHORIZATION_BOOTSTRAP_PASSWORD: ci-only-dummy-password
      AUTHORIZATION_JWT_PRIVATE_KEY_PEM: ci-only-dummy-private-key
      AUTHORIZATION_GATEWAY_SERVICE_TOKEN: ci-only-dummy-gateway-token
      AUTHORIZATION_ADMIN_SERVICE_TOKEN: ci-only-dummy-admin-token
      AUTHORIZATION_SHARED_NETWORK: ci-not-a-production-network
    steps:
      - uses: actions/checkout@v4
      - name: Verify Compose plugin and service inheritance
        shell: bash
        run: |
          docker compose version
          docker compose -f services/authorization/docker-compose.coolify.yaml config --quiet
          test "$(docker compose -f services/authorization/docker-compose.coolify.yaml config --services)" = authorization
          docker compose -f services/authorization/docker-compose.coolify.yaml config > /tmp/auth-compose-rendered.yaml
          grep -Fq 'dockerfile: services/authorization/Dockerfile' /tmp/auth-compose-rendered.yaml
          grep -Fq 'AUTHORIZATION_JWT_PRIVATE_KEY_PEM:' /tmp/auth-compose-rendered.yaml
          grep -Fq 'AUTHORIZATION_POSTGRES_PASSWORD:' /tmp/auth-compose-rendered.yaml
      - name: Build only isolated Authorization image
        shell: bash
        run: docker build --file services/authorization/Dockerfile --tag mcp-bridge:auth-packaging-smoke .

  images:
    if: github.event_name == 'workflow_dispatch' && inputs.build_images == true
    runs-on: zoomies-mcp-bridge-builder
    strategy:
      fail-fast: false
      matrix:
        target: [authorization, gateway, admin-api]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target "${{ matrix.target }}" -t "mcp-bridge:${{ matrix.target }}" .
