name: MVP Backend

on:
  pull_request:
    paths:
      - "services/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/mvp-backend.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run_authorization_integration: ${{ steps.plan.outputs.run_authorization_integration }}
      integration_suites: ${{ steps.plan.outputs.integration_suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            mapfile -t changed < <(git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}")
            python scripts/ci_plan.py "${changed[@]}" --github-output "$GITHUB_OUTPUT"
          else
            python scripts/ci_plan.py --force-full --github-output "$GITHUB_OUTPUT"
          fi

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --frozen --dev --no-install-project
      - run: .venv/bin/ruff check services tests scripts
      - run: .venv/bin/mypy services/authorization services/bridge services/common services/admin-api/src scripts/provision_authorization_database.py scripts/ci_plan.py
      - run: PYTHONPATH=services .venv/bin/python -m unittest discover -s tests -v

  integration-authorization:
    needs: plan
    if: needs.plan.outputs.run_authorization_integration == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      valkey:
        image: valkey/valkey:9.1.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --frozen --dev --no-install-project
      - name: Provision authorization database
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          AUTHORIZATION_POSTGRES_DB: authorization_mvp
          AUTHORIZATION_POSTGRES_USER: authorization_mvp
          AUTHORIZATION_POSTGRES_PASSWORD: authorization_mvp_secret
        run: .venv/bin/python scripts/provision_authorization_database.py
      - name: Run authorization PostgreSQL and Valkey integration tests
        env:
          TEST_POSTGRES_HOST: 127.0.0.1
          TEST_POSTGRES_PORT: "5432"
          TEST_AUTHORIZATION_POSTGRES_DB: authorization_mvp
          TEST_AUTHORIZATION_POSTGRES_USER: authorization_mvp
          TEST_AUTHORIZATION_POSTGRES_PASSWORD: authorization_mvp_secret
          TEST_VALKEY_URL: redis://127.0.0.1:6379/15
        run: PYTHONPATH=services .venv/bin/python -m unittest tests.test_postgres_authorization_access -v
