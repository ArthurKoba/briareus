server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    location /admin/ {
        try_files $uri $uri/ /index.html;
    }

    location = /admin {
        return 302 /admin/;
    }
}
