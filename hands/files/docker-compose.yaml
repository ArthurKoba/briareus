services:
  briareus-files:
    build:
      context: ../..
      dockerfile: hands/files/Dockerfile
    restart: "no"
    stop_grace_period: 30s
    environment:
      TZ: "${TZ:-UTC}"
      OTLP_ENDPOINT: "${OTLP_ENDPOINT:-}"
      # MCP resource trust remains disabled until actual Rauthy resource aud
      # and access-token signing algorithm have been independently verified.
      MCP_RESOURCE_AUDIENCE: "${MCP_RESOURCE_AUDIENCE:-}"
      MCP_RESOURCE_SIGNING_ALGORITHM: "${MCP_RESOURCE_SIGNING_ALGORITHM:-}"
      OTLP_BEARER_TOKEN: "${OTLP_BEARER_TOKEN:-}"
      OTEL_SERVICE_NAMESPACE: "${OTEL_SERVICE_NAMESPACE:?}"
      OTEL_DEPLOYMENT_ENVIRONMENT_NAME: "${OTEL_DEPLOYMENT_ENVIRONMENT_NAME:?}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:?}"
    expose:
      - "8000"
    networks:
      briareus:
        aliases: ["briareus-files"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).close()"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 96
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - "/tmp:rw,nosuid,noexec,size=16m"
    security_opt:
      - no-new-privileges:true
networks:
  briareus:
    external: true
    name: briareus-net
