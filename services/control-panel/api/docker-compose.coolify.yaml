x-watch-path-coolify:
  - "services/control-panel/api/**"

services:
  briareus-control-panel-api:
    extends:
      file: docker-compose.yaml
      service: briareus-control-panel-api
    environment:
      OIDC_ISSUER: "${OIDC_ISSUER:?}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:?}"
networks:
  briareus:
    external: true
    name: briareus-net
