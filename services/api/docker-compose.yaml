services:
  briareus-admin-api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      RAUTHY_ADMIN_API_KEY_BASE64: "${RAUTHY_ADMIN_API_KEY_BASE64:-}"
    expose:
      - "8000"
    networks:
      briareus:
        aliases: ["briareus-admin-api", "briareus-control-panel-api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 30s
    mem_limit: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
networks:
  briareus:
    external: true
    name: briareus-net
