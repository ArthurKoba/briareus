x-watch-path-coolify:
  - "services/api/**"

services:
  briareus-admin-api:
    extends:
      file: docker-compose.yaml
      service: briareus-admin-api
    environment:
      TZ: "${TZ:-UTC}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      RAUTHY_ADMIN_API_KEY_BASE64: "${RAUTHY_ADMIN_API_KEY_BASE64:-}"
networks:
  briareus:
    external: true
    name: briareus-net
