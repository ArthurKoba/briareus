x-watch-path-coolify:
  - "services/api/**"

services:
  briareus-admin-api:
    extends:
      file: docker-compose.yaml
      service: briareus-admin-api
    environment:
      TZ: "${TZ:-UTC}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      # Keep simple ${VAR}: Coolify v4.4.6 injects raw secrets for ${VAR:-}.
      RAUTHY_ADMIN_API_KEY: "${RAUTHY_ADMIN_API_KEY}"
networks:
  briareus:
    external: true
    name: briareus-net
