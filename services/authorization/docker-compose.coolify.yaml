# Existing production network, no extra operator-supplied network variable.
# Verify actual Coolify Compose parser support for cross-file extends before deploy.
services:
  authorization:
    extends:
      file: docker-compose.yaml
      service: authorization
    environment:
      SERVICE_URL_AUTHORIZATION_8000: /
    networks:
      - mcp

networks:
  mcp:
    external: true
    name: mcp
