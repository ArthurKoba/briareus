[project]
name = "mcp-bridge"
version = "0.1.0"
description = "Modular MCP bridge for local tools, isolated workers, and long-running agent tasks."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "ArthurKoba" }]
dependencies = [
  "fastmcp==4.0.10",
  "mcp[cli]>=2,<3",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "itsdangerous>=2.2,<3",
  "python-multipart>=0.0.20,<1",
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "cryptography>=46,<47",
  "PyJWT[crypto]>=2.10,<3",
  "uvicorn>=0.35,<1",
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
  "valkey>=6.1,<7",
]

[project.scripts]
mcp-serve = "common.asgi:main"

[dependency-groups]
web = ["playwright>=1.55,<2"]
dev = [
  "mypy>=1.18,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "services/auth_service",
  "services/bridge",
  "services/common",
  "services/modules",
]

[tool.hatch.build.targets.wheel.force-include]
"services/admin-api/src/admin_api" = "admin_api"

[tool.ruff]
src = ["services"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "ANN",
  "A",
  "ARG",
  "C4",
  "DTZ",
  "ASYNC",
  "G",
  "PLE",
  "PLW",
  "RSE",
  "PERF",
  "PIE",
  "RET",
  "RUF",
]
[tool.ruff.lint.per-file-ignores]
"services/modules/github/github_workflow.py" = ["E501"]

[tool.mypy]
mypy_path = "services,services/admin-api/src"
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
