services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcp-bridge}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-mcp-bridge}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    cpus: ${POSTGRES_CPU_LIMIT:-2.0}
    pids_limit: 256
    networks:
      - default
      - mcp

  valkey:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${VALKEY_MAX_MEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10
    mem_limit: ${VALKEY_MEMORY_LIMIT:-192m}
    cpus: ${VALKEY_CPU_LIMIT:-0.5}
    pids_limit: 128
    networks:
      - default
      - mcp

volumes:
  postgres-data:

networks:
  mcp:
    external: true
