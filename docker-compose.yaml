x-build: &build
  context: .
  dockerfile: Dockerfile

x-runtime: &runtime
  restart: unless-stopped
  healthcheck:
    test:
      - CMD
      - nc
      - -z
      - -w
      - "1"
      - 127.0.0.1
      - "8000"
    interval: 2s
    timeout: 1s
    start_period: 2s
    retries: 10

x-management-client: &management-client
  MANAGEMENT_SERVICE_TOKEN: ${MANAGEMENT_SERVICE_TOKEN:?}

x-observability: &observability
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-mcp-bridge}
  OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-0.1.0}
  OTEL_SERVICE_INSTANCE_ID: ${OTEL_SERVICE_INSTANCE_ID:-}
  OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-production}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
  OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-10000}
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-30000}
  OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-INFO}

x-private-service: &private-service
  <<: *runtime

x-file-service: &file-service
  <<: *private-service
  volumes:
    - terminal-workspace:/workspace

services:
  valkey:
    restart: unless-stopped
    image: valkey/valkey:9.1.2-alpine
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128

  management:
    <<: *runtime
    build:
      <<: *build
      target: management
    environment:
      <<: *observability
      MANAGEMENT_ENCRYPTION_KEY: ${MANAGEMENT_ENCRYPTION_KEY:?}
      MANAGEMENT_SERVICE_TOKEN: ${MANAGEMENT_SERVICE_TOKEN:?}
      MANAGEMENT_ADMIN_USERNAME: ${MANAGEMENT_ADMIN_USERNAME:?}
      MANAGEMENT_ADMIN_PASSWORD: ${MANAGEMENT_ADMIN_PASSWORD:?}
      MANAGEMENT_SESSION_SECRET: ${MANAGEMENT_SESSION_SECRET:?}
    volumes:
      - management:/management
      - terminal-workspace:/workspace

  auth:
    <<: *runtime
    build:
      <<: *build
      target: auth
    environment:
      <<: [*management-client, *observability]
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:?}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?}
      GITHUB_OAUTH_JWT_SIGNING_KEY: ${GITHUB_OAUTH_JWT_SIGNING_KEY:?}
      GITHUB_OAUTH_ALLOWED_USERS: ${GITHUB_OAUTH_ALLOWED_USERS:?}
    volumes:
      - auth:/auth

  gateway:
    <<: *runtime
    build:
      <<: *build
      target: gateway
    environment:
      <<: [*management-client, *observability]
      OAUTH_ENABLED: ${OAUTH_ENABLED:-true}
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:?}
      GITHUB_OAUTH_JWT_SIGNING_KEY: ${GITHUB_OAUTH_JWT_SIGNING_KEY:?}
      GITHUB_OAUTH_ALLOWED_USERS: ${GITHUB_OAUTH_ALLOWED_USERS:?}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:?}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:?}

  github:
    <<: *private-service
    depends_on:
      management:
        condition: service_healthy
        required: true
    build:
      <<: *build
      target: github
    environment:
      <<: [*management-client, *observability]
    volumes:
      - terminal-workspace:/workspace

  gitlab:
    <<: *private-service
    depends_on:
      management:
        condition: service_healthy
        required: true
    build:
      <<: *build
      target: gitlab
    environment:
      <<: [*management-client, *observability]
    volumes:
      - terminal-workspace:/workspace

  files:
    <<: *file-service
    build:
      <<: *build
      target: files
    environment:
      <<: [*management-client, *observability]

  web:
    <<: *file-service
    build:
      <<: *build
      target: web
    environment:
      <<: [*management-client, *observability]
      TZ: ${TZ:-UTC}
    volumes:
      - terminal-workspace:/workspace
      - web-browser:/browser
    shm_size: 1gb

  terminal:
    <<: *private-service
    build:
      <<: *build
      target: terminal
    environment:
      <<: [*management-client, *observability]
    mem_limit: ${TERMINAL_MEMORY_LIMIT:-2g}
    memswap_limit: ${TERMINAL_MEMORY_SWAP_LIMIT:-2g}
    cpus: ${TERMINAL_CPU_LIMIT:-1.5}
    pids_limit: ${TERMINAL_PIDS_LIMIT:-256}
    volumes:
      - terminal-workspace:/workspace
      - terminal-home:/home/agent

  analysis:
    <<: *private-service
    depends_on:
      ghidra:
        condition: service_healthy
        required: true
    build:
      <<: *build
      target: analysis
    environment:
      <<: [*management-client, *observability]
    volumes:
      - terminal-workspace:/workspace

  ghidra:
    <<: *private-service
    build:
      <<: *build
      target: ghidra
    environment:
      <<: [*management-client, *observability]
    networks:
      - default
      - coolify

  observability:
    <<: *private-service
    depends_on:
      management:
        condition: service_healthy
        required: true
    build:
      <<: *build
      target: observability
    environment:
      <<: [*management-client, *observability]

volumes:
  management:
  auth:
  terminal-workspace:
  terminal-home:
  web-browser:

networks:
  coolify:
    external: true
    name: coolify
