services:
  admin-ui:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_UI_PREVIEW: ${ADMIN_UI_PREVIEW:-false}
      ADMIN_UI_TELEMETRY_ENABLED: ${ADMIN_UI_TELEMETRY_ENABLED:-true}
      ADMIN_UI_TELEMETRY_ENDPOINT: ${ADMIN_UI_TELEMETRY_ENDPOINT:-/api/telemetry}
      ADMIN_UI_TELEMETRY_SAMPLE_RATE: ${ADMIN_UI_TELEMETRY_SAMPLE_RATE:-1}
      ADMIN_UI_EVENTS_MODE: ${ADMIN_UI_EVENTS_MODE:-hybrid}
      ADMIN_UI_EVENTS_URL: ${ADMIN_UI_EVENTS_URL:-/api/realtime}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 1s
      start_period: 1s
      retries: 10
