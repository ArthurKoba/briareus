x-watch-path-coolify:
  - "deploy/data/docker-compose.yaml"
  - "deploy/data/docker-compose.coolify.yaml"

# Per-Application Coolify adapter: vendor services deploy together as one data release.
services:
  briareus-dev-postgres:
    extends:
      file: docker-compose.yaml
      service: briareus-dev-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-briareus_dev}"
      POSTGRES_USER: "${POSTGRES_USER:-briareus}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      TZ: "${TZ:-UTC}"
  briareus-dev-valkey:
    extends:
      file: docker-compose.yaml
      service: briareus-dev-valkey
    environment:
      VALKEY_PASSWORD: "${VALKEY_PASSWORD:?}"
      TZ: "${TZ:-UTC}"
volumes:
  postgres-data:
    name: briareus-dev-postgres-v1
  valkey-data:
    name: briareus-dev-valkey-v1
networks:
  briareus:
    external: true
    name: briareus-net
