x-watch-path-coolify:
  - "deploy/gateway/Dockerfile"
  - "deploy/gateway/Dockerfile.dockerignore"
  - "deploy/gateway/docker-compose.coolify.yaml"
  - "deploy/gateway/docker-compose.yaml"
  - "deploy/gateway/uv-project/.python-version"
  - "deploy/gateway/uv-project/pyproject.toml"
  - "deploy/gateway/uv-project/uv.lock"
  - "deploy/runtime_write_provenance.py"
  - "services/bridge/__init__.py"
  - "services/bridge/server.py"
  - "services/bridge/single_origin.py"
  - "services/common/__init__.py"
  - "services/common/account_contracts.py"
  - "services/common/admin_api_client.py"
  - "services/common/asgi.py"
  - "services/common/cache.py"
  - "services/common/http_transport.py"
  - "services/common/models.py"
  - "services/common/oauth_session_contracts.py"
  - "services/common/observability.py"
  - "services/common/runtime_policy_contracts.py"
  - "services/common/settings.py"
  - "services/modules/__init__.py"
  - "services/modules/project_runtime/__init__.py"
  - "services/modules/project_runtime/runtime_telemetry.py"

# Coolify override for a single independent Git-backed Application.
# Coolify variable discovery happens before resolving extends; mirror env keys.
# Secret values, when consumed, come only from protected Coolify Project Shared Variables. No secret in Git.
# No public SERVICE_FQDN_* until security acceptance.
services:
  briareus-gateway:
    extends:
      file: docker-compose.yaml
      service: briareus-gateway
    environment:
      TZ: "${TZ:-UTC}"
      OTLP_ENDPOINT: "${OTLP_ENDPOINT:-}"
      OTLP_BEARER_TOKEN: "${OTLP_BEARER_TOKEN:-}"
      OTEL_SERVICE_NAMESPACE: "${OTEL_SERVICE_NAMESPACE:?}"
      OTEL_DEPLOYMENT_ENVIRONMENT_NAME: "${OTEL_DEPLOYMENT_ENVIRONMENT_NAME:?}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:?}"
networks:
  briareus:
    external: true
    name: briareus-net
