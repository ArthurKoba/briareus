# Portable Compose. One service / one Coolify Application; staged, not deployed.
# No dependency on legacy MCP resources, volumes, databases or networks.
services:
  briareus-gateway:
    build:
      context: ../..
      dockerfile: deploy/gateway/Dockerfile
    restart: "no"
    # Static-only ASGI_APP from the reviewed Gateway image; C2 routes remain denied.
    stop_grace_period: 30s
    environment:
      TZ: "${TZ:-UTC}"
      OTLP_ENDPOINT: "${OTLP_ENDPOINT:-}"
      OTLP_BEARER_TOKEN: "${OTLP_BEARER_TOKEN:-}"
      OTEL_SERVICE_NAMESPACE: "${OTEL_SERVICE_NAMESPACE:?}"
      OTEL_DEPLOYMENT_ENVIRONMENT_NAME: "${OTEL_DEPLOYMENT_ENVIRONMENT_NAME:?}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:?}"
    expose:
      - "8000"
    networks:
      briareus:
        aliases: ["briareus-gateway"]
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
networks:
  briareus:
    external: true
    name: briareus-net
