# Portable Compose. One service / one Coolify Application; staged, not deployed.
# No dependency on legacy MCP resources, volumes, databases or networks.
services:
  briareus-dev-web:
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
    restart: "no"
    # No legacy provider/server startup until C1-B2/C2 is accepted.
    command: ["/bin/sh", "-ec", "echo DEV_RUNTIME_TRANSPORT_PENDING >&2; exit 78"]
    stop_grace_period: 30s
    environment:
      BROWSER_PROFILE_PATH: "/browser/profile"
      TZ: "${TZ:-UTC}"
    expose:
      - "8000"
    networks:
      briareus:
        aliases: ["briareus-dev-web"]
    volumes:
      - data:/browser
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 192
    security_opt:
      - no-new-privileges:true
volumes:
  data:
    name: briareus-dev-web-v1
networks:
  briareus:
    external: true
    name: briareus-net
