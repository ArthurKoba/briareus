# One Briareus SVC module, with GitHub and GitLab adapters in one image.
# C1-B2/C2: signed service caller and unified runtime not yet implemented.
services:
  briareus-dev-svc:
    build:
      context: ../..
      dockerfile: deploy/svc/Dockerfile
    restart: "no"
    stop_grace_period: 30s
    command: ["/bin/sh", "-ec", "echo BRIAREUS_SVC_AUTH_PENDING >&2; exit 78"]
    environment:
      TZ: "${TZ:-UTC}"
    expose:
      - "8000"
    networks:
      briareus:
        aliases: ["briareus-dev-svc"]
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 96
    security_opt:
      - no-new-privileges:true
networks:
  briareus:
    external: true
    name: briareus-net
