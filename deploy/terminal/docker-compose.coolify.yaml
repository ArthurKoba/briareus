x-watch-path-coolify:
  - "deploy/terminal/Dockerfile"
  - "deploy/terminal/docker-compose.yaml"
  - "deploy/terminal/docker-compose.coolify.yaml"
  - "pyproject.toml"
  - "uv.lock"
  - "services/common/**"
  - "services/modules/__init__.py"
  - "services/modules/project_runtime/**"
  - "services/modules/terminal/**"

# Coolify override for a single independent Git-backed Application.
# Coolify variable discovery happens before resolving extends; mirror env keys.
# Secret values, when consumed, come only from protected Coolify Project Shared Variables. No secret in Git.
# No public SERVICE_FQDN_* until security acceptance.
services:
  briareus-dev-terminal:
    extends:
      file: docker-compose.yaml
      service: briareus-dev-terminal
    environment:
      TZ: "${TZ:-UTC}"
volumes:
  data:
    name: briareus-dev-terminal-v1
networks:
  briareus:
    external: true
    name: briareus-net
