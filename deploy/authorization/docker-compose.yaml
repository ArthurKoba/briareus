# Portable Compose. One service / one Coolify Application; staged, not deployed.
# No dependency on legacy MCP resources, volumes, databases or networks.
services:
  briareus-authorization:
    build:
      context: ../..
      dockerfile: deploy/authorization/Dockerfile
    restart: "no"
    stop_grace_period: 30s
    environment:
      TZ: "${TZ:-UTC}"
    expose:
      - "8000"
    networks:
      briareus:
        aliases: ["briareus-authorization"]
    # Safety gate: the historic authorization.runtime auto-creates legacy schema.
    # This image intentionally has no greenfield Authorization startup.
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 96
    security_opt:
      - no-new-privileges:true
networks:
  briareus:
    external: true
    name: briareus-net
