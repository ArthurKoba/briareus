x-watch-path-coolify:
  - "deploy/authorization/Dockerfile"
  - "deploy/authorization/docker-compose.yaml"
  - "deploy/authorization/docker-compose.coolify.yaml"
  - "pyproject.toml"
  - "uv.lock"
  - "services/common/**"
  - "services/authorization/**"
  - "services/identity/**"
  - "services/teams/**"
  - "services/projects/**"
  - "services/agents/**"

# Coolify override for a single independent Git-backed Application.
# Coolify variable discovery happens before resolving extends; mirror env keys.
# Secret values, when consumed, come only from protected Coolify Project Shared Variables. No secret in Git.
# No public SERVICE_FQDN_* until security acceptance.
services:
  briareus-authorization:
    extends:
      file: docker-compose.yaml
      service: briareus-authorization
    environment:
      TZ: "${TZ:-UTC}"
networks:
  briareus:
    external: true
    name: briareus-net
