x-watch-path-coolify:
  - "deploy/authorization/Dockerfile"
  - "deploy/authorization/docker-compose.yaml"
  - "deploy/authorization/docker-compose.coolify.yaml"
  - "pyproject.toml"
  - "uv.lock"
  - "README.md"
  - "LICENSE"
  - "services/authorization/**"
  - "services/common/**"
  - "services/identity/**"
  - "services/teams/**"
  - "services/projects/**"
  - "services/agents/**"
  - "services/bridge/**"
  - "services/modules/**"
  - "services/admin-api/src/presentation/**"
  - "services/admin-api/src/platform_runtime.py"
  - "services/admin-api/src/api_errors.py"
  - "scripts/alembic.ini"
  - "scripts/alembic_greenfield/**"

# Coolify parser materializes required DB variables and optional telemetry
# defaults. Shared reference VALUES are configured only through scoped
# Coolify Team/Environment bindings; no token or secret is stored in Git.
services:
  briareus-authorization:
    extends:
      file: docker-compose.yaml
      service: briareus-authorization
    environment:
      TZ: "${TZ:-UTC}"
      OTLP_ENDPOINT: "${OTLP_ENDPOINT:-}"
      OTLP_BEARER_TOKEN: "${OTLP_BEARER_TOKEN:-}"
      SERVICE_NAMESPACE: "${SERVICE_NAMESPACE:-briareus}"
      DEPLOYMENT_ENVIRONMENT: "${DEPLOYMENT_ENVIRONMENT:-development}"
      OTEL_SERVICE_NAME: "authorization"
      POSTGRES_HOST: "briareus-postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "briareus_dev"
      POSTGRES_USER: "${POSTGRES_USER:?}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
networks:
  briareus:
    external: true
    name: briareus-net
