# Portable Compose. One service / one Coolify Application; staged, not deployed.
# No dependency on legacy MCP resources, volumes, databases or networks.
services:
  briareus-dev-admin-api:
    build:
      context: ../..
      dockerfile: deploy/admin-api/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      PLATFORM_DATABASE_URL: "${PLATFORM_DATABASE_URL:?}"
      PLATFORM_INVITATION_ENCRYPTION_KEY: "${PLATFORM_INVITATION_ENCRYPTION_KEY:?}"
      PLATFORM_IDEMPOTENCY_ENCRYPTION_KEY: "${PLATFORM_IDEMPOTENCY_ENCRYPTION_KEY:?}"
      PLATFORM_RESOURCE_ENCRYPTION_KEY: "${PLATFORM_RESOURCE_ENCRYPTION_KEY:?}"
      PLATFORM_ADMIN_JWT_SIGNING_KEY: "${PLATFORM_ADMIN_JWT_SIGNING_KEY:?}"
      PLATFORM_REGISTRATION_BASE_URL: "${PLATFORM_REGISTRATION_BASE_URL:?}"
      PLATFORM_ADMIN_PREVIEW_ENABLED: "true"
      PLATFORM_ADMIN_PREVIEW_LOG_SYSTEM_INVITE: "false"
      PLATFORM_SERVICE_IDENTITY_ENABLED: "false"
      TZ: "${TZ:-UTC}"
    expose:
      - "8000"
    networks:
      briareus:
        aliases: ["briareus-dev-admin-api"]
    # Loopback-only preview inside its own container; no public Admin API or proxy.
    # Health can be inspected only from a trusted container exec.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 2 http://127.0.0.1:8000/health/live >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 8
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
networks:
  briareus:
    external: true
    name: briareus-net
