x-watch-path-coolify:
  - "deploy/admin-api/Dockerfile"
  - "deploy/admin-api/Dockerfile.dockerignore"
  - "deploy/admin-api/docker-compose.coolify.yaml"
  - "deploy/admin-api/docker-compose.yaml"
  - "deploy/admin-api/uv-project/.python-version"
  - "deploy/admin-api/uv-project/pyproject.toml"
  - "deploy/admin-api/uv-project/uv.lock"
  - "deploy/runtime_write_provenance.py"
  - "services/admin-api/src/platform_runtime.py"

# Coolify override for a single independent Git-backed Application.
# Coolify variable discovery happens before resolving extends; mirror env keys.
# Shared values resolve from approved Coolify Team/Environment scopes; no secret value is stored in Git.
# API remains internal; Gateway owns public domain. C1-B2/C2 still denied.
services:
  briareus-admin-api:
    extends:
      file: docker-compose.yaml
      service: briareus-admin-api
    environment:
      TZ: "${TZ:-UTC}"
      OTLP_ENDPOINT: "${OTLP_ENDPOINT:-}"
      OTLP_BEARER_TOKEN: "${OTLP_BEARER_TOKEN:-}"
      OTEL_SERVICE_NAMESPACE: "${OTEL_SERVICE_NAMESPACE:?}"
      OTEL_DEPLOYMENT_ENVIRONMENT_NAME: "${OTEL_DEPLOYMENT_ENVIRONMENT_NAME:?}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:?}"
networks:
  briareus:
    external: true
    name: briareus-net
