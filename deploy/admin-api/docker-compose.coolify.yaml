x-watch-path-coolify:
  - "deploy/admin-api/Dockerfile"
  - "deploy/admin-api/docker-compose.yaml"
  - "deploy/admin-api/docker-compose.coolify.yaml"
  - "pyproject.toml"
  - "uv.lock"
  - "services/common/**"
  - "services/authorization/**"
  - "services/identity/**"
  - "services/teams/**"
  - "services/projects/**"
  - "services/agents/**"
  - "services/admin-api/src/**"

# Coolify override for a single independent Git-backed Application.
# Coolify variable discovery happens before resolving extends; mirror env keys.
# Shared values resolve from approved Coolify Team/Environment scopes; no secret value is stored in Git.
# No public SERVICE_FQDN_* until security acceptance.
services:
  briareus-dev-admin-api:
    extends:
      file: docker-compose.yaml
      service: briareus-dev-admin-api
    environment:
      TZ: "{{team.TZ}}"
      OTLP_ENDPOINT: "{{team.OTLP_ENDPOINT}}"
      OTLP_BEARER_TOKEN: "{{team.OTLP_BEARER_TOKEN}}"
      SERVICE_NAMESPACE: "{{environment.SERVICE_NAMESPACE}}"
      DEPLOYMENT_ENVIRONMENT: "{{environment.DEPLOYMENT_ENVIRONMENT}}"
      OTEL_SERVICE_NAME: "admin-api"
      POSTGRES_HOST: "briareus-dev-postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "briareus_dev"
      POSTGRES_USER: "{{environment.POSTGRES_USER}}"
      POSTGRES_PASSWORD: "{{environment.POSTGRES_PASSWORD}}"
networks:
  briareus:
    external: true
    name: briareus-net
