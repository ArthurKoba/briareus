x-watch-path-coolify:
  - "deploy/admin-api/Dockerfile"
  - "deploy/admin-api/docker-compose.yaml"
  - "deploy/admin-api/docker-compose.coolify.yaml"
  - "pyproject.toml"
  - "uv.lock"
  - "services/common/**"
  - "services/authorization/**"
  - "services/identity/**"
  - "services/teams/**"
  - "services/projects/**"
  - "services/agents/**"
  - "services/admin-api/src/**"

# Coolify override for a single independent Git-backed Application.
# Coolify variable discovery happens before resolving extends; mirror env keys.
# Shared values resolve from approved Coolify Team/Environment scopes; no secret value is stored in Git.
# Public FQDN is provisioned, but protected API routes remain denied pending C1-B2/C2.
services:
  briareus-admin-api:
    extends:
      file: docker-compose.yaml
      service: briareus-admin-api
    environment:
      TZ: "${TZ:-UTC}"
      OTLP_ENDPOINT: "${OTLP_ENDPOINT:-}"
      OTLP_BEARER_TOKEN: "${OTLP_BEARER_TOKEN:-}"
      SERVICE_NAMESPACE: "${SERVICE_NAMESPACE:-briareus}"
      DEPLOYMENT_ENVIRONMENT: "${DEPLOYMENT_ENVIRONMENT:-development}"
      OTEL_SERVICE_NAME: "admin-api"
      POSTGRES_HOST: "briareus-postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "briareus_dev"
      POSTGRES_USER: "${POSTGRES_USER:?}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      SERVICE_URL_BRIAREUS_ADMIN_API_8000: "/"
networks:
  briareus:
    external: true
    name: briareus-net
