# Portable independent runtime; private only, C1-B2/C2 pending.
services:
  briareus-dev-reverse:
    build:
      context: ../..
      dockerfile: deploy/reverse/Dockerfile
    restart: "no"
    # No legacy provider/server startup until C1-B2/C2 is accepted.
    command: ["/bin/sh", "-ec", "echo DEV_RUNTIME_TRANSPORT_PENDING >&2; exit 78"]
    stop_grace_period: 30s
    environment:
      TZ: "${TZ:-UTC}"
    expose:
      - "8000"
    networks:
      briareus:
        aliases: ["briareus-dev-reverse"]
    mem_limit: 1024m
    cpus: 0.75
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
networks:
  briareus:
    external: true
    name: briareus-net
