# Portable Compose. One service / one Coolify Application; staged, not deployed.
# No dependency on legacy MCP resources, volumes, databases or networks.
services:
  briareus-dev-authorization:
    build:
      context: ../../..
      dockerfile: deploy/coolify/_build/Dockerfile.greenfield
      target: authorization-staged
    restart: "no"
    stop_grace_period: 30s
    environment:
      PLATFORM_DATABASE_URL: "${PLATFORM_DATABASE_URL:?}"
      PLATFORM_ADMIN_JWT_SIGNING_KEY: "${PLATFORM_ADMIN_JWT_SIGNING_KEY:?}"
      PLATFORM_SERVICE_IDENTITY_ENABLED: "false"
      TZ: "${TZ:-UTC}"
    expose:
      - "8000"
    networks:
      briareus:
        aliases: ["briareus-dev-authorization"]
    # Safety gate: the historic authorization.runtime auto-creates legacy schema.
    # This image intentionally has no greenfield Authorization startup.
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 96
    security_opt:
      - no-new-privileges:true
networks:
  briareus:
    external: true
    name: briareus-net
