x-watch-path-coolify:
  - "deploy/coolify/authorization/docker-compose.yaml"
  - "deploy/coolify/authorization/docker-compose.coolify.yaml"
  - "deploy/coolify/_build/Dockerfile.greenfield"
  - "pyproject.toml"
  - "uv.lock"
  - "services/common/**"
  - "services/authorization/**"
  - "services/identity/**"
  - "services/teams/**"
  - "services/projects/**"
  - "services/agents/**"

# Coolify override for a single independent Git-backed Application.
# Coolify variable discovery happens before resolving extends; mirror env keys.
# Scope secret variable VALUES to Coolify's development environment. No secret in Git.
# No public SERVICE_FQDN_* until security acceptance.
services:
  briareus-dev-authorization:
    extends:
      file: docker-compose.yaml
      service: briareus-dev-authorization
    environment:
      PLATFORM_DATABASE_URL: "${PLATFORM_DATABASE_URL:?}"
      PLATFORM_ADMIN_JWT_SIGNING_KEY: "${PLATFORM_ADMIN_JWT_SIGNING_KEY:?}"
      PLATFORM_SERVICE_IDENTITY_ENABLED: "false"
      TZ: "${TZ:-UTC}"
networks:
  briareus:
    external: true
    name: briareus-net
