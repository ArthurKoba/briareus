services:
  gateway:
    restart: unless-stopped
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: gateway
    healthcheck:
      test: ["CMD", "nc", "-z", "-w", "1", "127.0.0.1", "8000"]
      interval: 2s
      timeout: 1s
      start_period: 2s
      retries: 10
    expose:
      - "8000"
    environment:
      TZ: ${TZ:-UTC}
      LANG: ${LANG:-C.UTF-8}
      LC_ALL: ${LC_ALL:-C.UTF-8}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
      ADMIN_API_URL: ${ADMIN_API_URL:-http://admin-api:8000}
      ADMIN_API_SERVICE_TOKEN: ${ADMIN_API_SERVICE_TOKEN:?}
      SERVICE_NAMESPACE: ${SERVICE_NAMESPACE:-MCP}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTLP_BEARER_TOKEN: ${OTLP_BEARER_TOKEN:-}
      OTEL_SERVICE_NAME: gateway
      GITHUB_URL: ${GITHUB_URL:-http://github:8000/mcp}
      GITLAB_URL: ${GITLAB_URL:-http://gitlab:8000/mcp}
      FILES_URL: ${FILES_URL:-http://files:8000/mcp}
      WEB_URL: ${WEB_URL:-http://web:8000/mcp}
      ANALYSIS_URL: ${ANALYSIS_URL:-http://analysis:8000/mcp}
      GHIDRA_URL: ${GHIDRA_URL:-http://ghidra:8000/mcp}
      TERMINAL_URL: ${TERMINAL_URL:-http://terminal:8000/mcp}
      OBSERVABILITY_URL: ${OBSERVABILITY_URL:-http://observability:8000/mcp}
      OAUTH_ENABLED: ${OAUTH_ENABLED:-true}
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:?}
      GITHUB_OAUTH_JWT_SIGNING_KEY: ${GITHUB_OAUTH_JWT_SIGNING_KEY:?}
      GITHUB_OAUTH_ALLOWED_USERS: ${GITHUB_OAUTH_ALLOWED_USERS:?}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:?}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:?}
    networks:
      mcp:
        aliases: [gateway]
      coolify: {}

networks:
  mcp:
    external: true
    name: ${MCP_NETWORK_NAME:-mcp}
  coolify:
    external: true
    name: coolify
