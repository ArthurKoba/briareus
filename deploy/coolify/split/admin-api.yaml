services:
  admin-api:
    restart: unless-stopped
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: admin-api
    healthcheck:
      test: ["CMD", "nc", "-z", "-w", "1", "127.0.0.1", "8000"]
      interval: 2s
      timeout: 1s
      start_period: 2s
      retries: 10
    expose:
      - "8000"
    environment:
      TZ: ${TZ:-UTC}
      LANG: ${LANG:-C.UTF-8}
      LC_ALL: ${LC_ALL:-C.UTF-8}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
      ADMIN_API_ENCRYPTION_KEY: ${ADMIN_API_ENCRYPTION_KEY:?}
      ADMIN_API_SERVICE_TOKEN: ${ADMIN_API_SERVICE_TOKEN:?}
      ADMIN_API_USERNAME: ${ADMIN_API_USERNAME:-admin}
      ADMIN_API_PASSWORD: ${ADMIN_API_PASSWORD:?}
      ADMIN_API_SESSION_SECRET: ${ADMIN_API_SESSION_SECRET:?}
      ADMIN_UI_ORIGIN: ${ADMIN_UI_ORIGIN:?}
      SERVICE_NAMESPACE: ${SERVICE_NAMESPACE:-MCP}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTLP_BEARER_TOKEN: ${OTLP_BEARER_TOKEN:-}
      OTEL_SERVICE_NAME: admin-api
    volumes:
      - admin-api-data:/admin-api
      - workspace:/workspace
    networks:
      mcp:
        aliases: [admin-api]
      coolify: {}

volumes:
  admin-api-data:
    external: true
    name: ${MCP_ADMIN_API_VOLUME:?}
  workspace:
    external: true
    name: ${MCP_WORKSPACE_VOLUME:?}

networks:
  mcp:
    external: true
    name: ${MCP_NETWORK_NAME:-mcp}
  coolify:
    external: true
    name: coolify
