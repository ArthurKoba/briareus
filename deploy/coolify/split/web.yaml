services:
  web:
    restart: unless-stopped
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: web
    healthcheck:
      test: ["CMD", "nc", "-z", "-w", "1", "127.0.0.1", "8000"]
      interval: 2s
      timeout: 1s
      start_period: 2s
      retries: 10
    environment:
      TZ: ${TZ:-UTC}
      LANG: ${LANG:-C.UTF-8}
      LC_ALL: ${LC_ALL:-C.UTF-8}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
      ADMIN_API_URL: ${ADMIN_API_URL:-http://admin-api:8000}
      ADMIN_API_SERVICE_TOKEN: ${ADMIN_API_SERVICE_TOKEN:?}
      SERVICE_NAMESPACE: ${SERVICE_NAMESPACE:-MCP}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTLP_BEARER_TOKEN: ${OTLP_BEARER_TOKEN:-}
      OTEL_SERVICE_NAME: web
    volumes:
      - workspace:/workspace
      - browser-data:/browser
    devices:
      - ${BROWSER_DRI_DEVICE:-/dev/dri/renderD128}:${BROWSER_DRI_DEVICE:-/dev/dri/renderD128}
    shm_size: 1gb
    mem_limit: ${WEB_MEMORY_LIMIT:-6g}
    memswap_limit: ${WEB_MEMORY_SWAP_LIMIT:-6g}
    cpus: ${WEB_CPU_LIMIT:-3.0}
    pids_limit: ${WEB_PIDS_LIMIT:-512}
    networks:
      mcp:
        aliases: [web]

volumes:
  workspace:
    external: true
    name: ${MCP_WORKSPACE_VOLUME:?}
  browser-data:
    external: true
    name: ${MCP_BROWSER_VOLUME:?}

networks:
  mcp:
    external: true
    name: ${MCP_NETWORK_NAME:-mcp}
