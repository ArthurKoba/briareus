services:
  valkey:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
    networks:
      mcp:
        aliases: [valkey]

networks:
  mcp:
    external: true
    name: ${MCP_NETWORK_NAME:-mcp}
